<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - AIO All In One</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>AIO - All In One</h1>
  <a href="index.html">Home</a><a href="groceries.html">Groceries</a><a href="medicines.html">Medicines</a><a href="printouts.html">Printouts</a><a href="services.html">Home Services</a><a href="orders.html">Orders</a><a href="cart.html" id="cart-link">Cart (0)</a>
</header>
<main>
<h2>Your Cart</h2>
<p id="msg" class="msg"></p>
<table>
  <tr><th>Item</th><th>Price</th><th>Qty</th><th>Total</th><th>Change</th></tr>
  <tbody id="cart-rows"></tbody>
</table>
<div class="box" id="bill"></div>
<div class="box">
  <label for="promo">Promo code</label>
  <input type="text" id="promo" oninput="showCart()">
  <div id="rx-box" style="display:none">
    <label for="rx-file">Prescription file (needed for Rx medicines)</label>
    <input type="file" id="rx-file">
  </div>
  <label for="address">Delivery address</label>
  <input type="text" id="address" size="40">
  <label for="payment">Payment method</label>
  <select id="payment"><option>UPI</option><option>Card</option><option>Cash on delivery</option></select><br>
  <button onclick="placeOrder()">Place order</button>
</div>
</main>
<footer>AIO - All In One | College project made with HTML, CSS and JavaScript</footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
showCartCount();
showCart();
</script>
</body>
</html>
