<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printouts - AIO All In One</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>AIO - All In One</h1>
  <a href="index.html">Home</a><a href="groceries.html">Groceries</a><a href="medicines.html">Medicines</a><a href="printouts.html">Printouts</a><a href="services.html">Home Services</a><a href="orders.html">Orders</a><a href="cart.html" id="cart-link">Cart (0)</a>
</header>
<main>
<h2>Printouts</h2>
<p id="msg" class="msg"></p>
<div class="box">
  <label for="file">Document</label><input type="file" id="file">
  <label for="pages">Total pages</label><input type="number" id="pages" value="10" min="1" oninput="getQuote()">
  <label for="copies">Copies</label><input type="number" id="copies" value="1" min="1" oninput="getQuote()">
  <label for="colour">Colour</label><select id="colour" onchange="getQuote()"><option>Black and White</option><option>Color</option></select>
  <label for="sides">Sides</label><select id="sides" onchange="getQuote()"><option>Single-sided</option><option>Double-sided</option></select>
  <label for="paper">Paper size</label><select id="paper" onchange="getQuote()"><option>A4</option><option>A3</option></select>
  <label for="binding">Binding</label><select id="binding" onchange="getQuote()"><option>None</option><option>Stapled</option><option>Spiral</option></select>
  <label for="fulfil">Delivery or pickup</label><select id="fulfil" onchange="getQuote()"><option>Home delivery</option><option>Store pickup</option></select>
</div>
<div class="box" id="quote"></div>
<button onclick="placePrint()">Place print order</button>
</main>
<footer>AIO - All In One | College project made with HTML, CSS and JavaScript</footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
showCartCount();
getQuote();
</script>
</body>
</html>
